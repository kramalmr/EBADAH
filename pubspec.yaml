name: ebadah
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.1.0
  lucide_icons_flutter: ^3.1.13
  path: ^1.9.1
  sqflite: ^2.4.2
  http: ^1.6.0
  smooth_page_indicator: ^2.0.1
  url_launcher: ^6.3.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  country_state_city: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - "assets/icon.svg"
    - "assets/kabah.svg"
    - "assets/mosque.svg"
    - "assets/posters/P1.jpg"
    - "assets/posters/P2.jpg"
    - "assets/posters/P3.jpg"
    - "assets/posters/P4.jpg"
    - "assets/posters/P5.jpg"
    - "assets/doa_input.json"
